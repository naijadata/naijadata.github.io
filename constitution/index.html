<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaijaConstitution | Legal Archive</title>
    <!-- Premium Google Fonts: Serif for Law, Sans-serif for UI -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <!-- Header Brand Section -->
    <header>
      <div class="header-container">
        <div class="header-left">
          <!-- Back to NaijaData Button -->
          <a href="../index.html" class="back-hub-btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Hub
          </a>

          <div class="logo-area">
            <div class="icon-wrapper">
              <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <rect
                  x="10"
                  y="10"
                  width="100"
                  height="100"
                  rx="15"
                  fill="#008751"
                />
                <path
                  d="M30 45 h60 M60 25 v55 M40 70 h40"
                  stroke="white"
                  stroke-width="6"
                  stroke-linecap="round"
                />
                <circle cx="30" cy="45" r="5" fill="#FFD700" />
                <circle cx="90" cy="45" r="5" fill="#FFD700" />
              </svg>
            </div>
            <h1>Naija<span>Constitution</span></h1>
          </div>
        </div>

        <!-- Global Search Box -->
        <div class="search-box">
          <input
            type="text"
            id="mainSearch"
            placeholder="Search sections, titles, or tags..."
            autocomplete="off"
          />
        </div>
      </div>
    </header>

    <!-- Toolbar Filters Section -->
    <section class="toolbar">
      <div class="toolbar-container">
        <div class="filter-group">
          <select id="chapterFilter">
            <option value="">All Chapters</option>
          </select>
          <select id="tagFilter">
            <option value="">All Tags</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Main Workspace -->
    <div class="app-shell">
      <!-- Table of Contents Sidebar -->
      <aside class="toc-sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2>Chapters Directory</h2>
        </div>
        <div id="toc-list" class="toc-list"></div>
      </aside>

      <!-- Document Reader Area -->
      <main class="content-reader">
        <div id="search-status" class="search-status">
          DATABASE ACCESS: Loading constitutional records...
        </div>
        <div id="constitution-render"></div>
      </main>
    </div>

    <!-- Load the digital constitution data first, then our custom JS -->
    <script src="data.js"></script>
    <script src="index.js"></script>
  </body>
</html>
