<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaijaIndex | Digital Newspaper Archive</title>
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <header>
      <div class="header-container">
        <div class="logo-area">
          <div class="logo-icon">
            <!-- Perfected Custom Icon -->
            <svg viewBox="0 0 120 120">
              <rect
                x="10"
                y="10"
                width="100"
                height="100"
                rx="15"
                fill="#008751"
              />
              <g transform="translate(18.5,106) scale(0.0165,-0.0165)">
                <path
                  d="M985 4623 c-60 -8 -141 -36 -208 -70 -93 -49 -163 -128 -231 -262 -158 -309 -206 -636 -128 -866 40 -119 46 -168 33 -256 -15 -95 -54 -174 -138 -279 -92 -114 -142 -194 -202 -320 -85 -181 -96 -233 -96 -465 0 -161 4 -215 19 -276 18 -76 18 -77 -3 -133 -15 -41 -21 -80 -21 -137 0 -78 1 -82 33 -114 52 -52 114 -60 327 -46 211 15 275 5 401 -60 138 -72 234 -182 359 -409 224 -410 293 -464 534 -425 55 8 154 29 220 46 67 17 173 35 236 41 158 14 248 32 312 62 118 56 175 133 204 276 9 47 25 109 35 139 46 132 177 290 370 444 227 183 371 181 500 -4 48 -68 98 -104 133 -95 65 16 180 196 340 531 155 325 203 410 326 576 75 101 130 207 211 411 143 358 258 517 444 610 90 46 114 91 114 214 0 48 -5 97 -11 108 -6 12 -35 47 -65 79 -62 68 -74 90 -138 252 -58 146 -93 209 -151 274 -75 84 -159 110 -242 76 -20 -9 -86 -49 -147 -90 -193 -129 -313 -145 -545 -72 -164 51 -223 60 -347 54 -163 -7 -252 -43 -405 -160 -91 -70 -158 -97 -236 -97 -78 0 -115 12 -282 90 -167 78 -228 98 -325 106 -82 7 -167 -12 -256 -57 -32 -16 -73 -29 -91 -29 -36 0 -42 3 -184 106 -125 89 -187 124 -301 168 -136 53 -282 74 -398 59z"
                  fill="white"
                />
              </g>
              <circle cx="45" cy="35" r="1.3" fill="#FFD700" />
              <circle cx="58" cy="32" r="1.3" fill="#00E5FF" />
              <circle cx="72" cy="33" r="1.3" fill="#ffffff" />
              <circle cx="60" cy="60" r="2.2" fill="#FFD700">
                <animate
                  attributeName="opacity"
                  values="1;0.3;1"
                  dur="2s"
                  repeatCount="indefinite"
                />
              </circle>
            </svg>
          </div>
          <h1>Naija<span>Index</span></h1>
        </div>

        <div class="search-container">
          <input
            type="text"
            id="searchInput"
            placeholder="Search by subject, fact, or source..."
          />
        </div>
      </div>
    </header>

    <div class="app-shell">
      <!-- Input Sidebar -->
      <aside class="admin-sidebar">
        <h2>Index New Fact</h2>
        <form id="indexForm">
          <input
            type="text"
            id="subject"
            placeholder="SUBJECT HEADING (e.g., HEALTH)"
            required
          />
          <input
            type="text"
            id="source"
            placeholder="Source (e.g., The Punch)"
            required
          />
          <input
            type="text"
            id="pub_date"
            placeholder="Pub. Date (e.g., April 26, 2016)"
            required
          />
          <input type="text" id="page" placeholder="Page Number" required />
          <input
            type="url"
            id="link"
            placeholder="External URL / Scan Link (Optional)"
          />
          <textarea
            id="fact"
            placeholder="The Fact / Statement to Archive"
            rows="5"
            required
          ></textarea>
          <input type="text" id="tags" placeholder="Tags (comma separated)" />
          <button type="submit" id="saveBtn">Archive to Digital Cabinet</button>
        </form>
      </aside>

      <!-- Main Display Feed -->
      <main class="fact-feed">
        <div id="statsCount" class="stats-bar">
          Connecting to digital archive...
        </div>
        <div id="cardsContainer">
          <!-- Cards injected here -->
        </div>
      </main>
    </div>

    <script src="index.js"></script>
  </body>
</html>
